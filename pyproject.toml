[project]
name = "perceptron-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Afina Khashirova", email = "afina.khashirova@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
perceptron-lab = "perceptron_lab:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
